# Publica la app en GitHub Pages (gratis) cada vez que subes cambios a la rama principal.
# Requisito único: en el repositorio → Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pruebas de geometría y de PDF
        run: |
          pnpm --filter @workspace/dibujo-tecnico-a4 run test:geometry
          pnpm --filter @workspace/dibujo-tecnico-a4 run verify:pdf
      - name: Compilar
        env:
          PORT: "3000"
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @workspace/dibujo-tecnico-a4 run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/dibujo-tecnico-a4/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
